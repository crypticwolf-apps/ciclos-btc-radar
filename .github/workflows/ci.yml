# Comprobación automática en cada cambio: tipos, tests y compilación.
# Se publica en main solo con esto en verde.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Compilación
        run: npm run build
